<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratorio de Compiladores — Lenguajes y Autómatas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#10152A;
    --surface:#1A2140;
    --surface-2:#222B52;
    --border:#303B66;
    --text:#EDEFF7;
    --muted:#98A2C7;
    --amber:#F2B84B;
    --amber-dim:#7A5F27;
    --teal:#4FD1C5;
    --rose:#E5646E;
    --mono:'IBM Plex Mono', monospace;
    --sans:'IBM Plex Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    line-height:1.55;
  }
  #app{min-height:100vh;}
  a{color:var(--amber);}
  button{
    font-family:var(--mono);
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    padding:10px 16px;
    font-size:13px;
    letter-spacing:.02em;
    transition:border-color .15s ease, color .15s ease;
  }
  button:hover{border-color:var(--amber);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{
    background:var(--amber);
    color:#181205;
    border-color:var(--amber);
    font-weight:600;
  }
  button.primary:hover{filter:brightness(1.08);}
  button.ghost{background:transparent;}
  button.danger{border-color:var(--rose);color:var(--rose);background:transparent;}
  input, textarea, select{
    font-family:var(--sans);
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    font-size:14px;
    width:100%;
    border-radius:2px;
  }
  textarea{font-family:var(--mono);font-size:13px;min-height:110px;resize:vertical;line-height:1.5;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber);}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-family:var(--mono);}
  h1,h2,h3,h4{font-family:var(--mono);font-weight:600;margin:0 0 8px 0;letter-spacing:-0.01em;}
  p{margin:0 0 12px 0;color:var(--text);}
  .muted{color:var(--muted);}
  .mono{font-family:var(--mono);}
  .hidden{display:none !important;}

  /* ---------- AUTH SCREEN ---------- */
  .auth-wrap{
    min-height:100vh;
    display:grid;
    grid-template-columns: 1.1fr 1fr;
  }
  @media (max-width: 860px){ .auth-wrap{grid-template-columns:1fr;} .auth-hero{display:none;} }
  .auth-hero{
    background:
      linear-gradient(180deg, rgba(16,21,42,.4), rgba(16,21,42,.92)),
      repeating-linear-gradient(115deg, #161c38 0px, #161c38 2px, #10152A 2px, #10152A 46px);
    padding:64px 56px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    border-right:1px solid var(--border);
  }
  .hero-tag{font-family:var(--mono);color:var(--amber);font-size:13px;margin-bottom:22px;}
  .hero-title{font-family:var(--mono);font-size:38px;line-height:1.15;max-width:520px;margin:0 0 18px 0;}
  .hero-sub{color:var(--muted);max-width:440px;font-size:15px;}
  .term{
    font-family:var(--mono);
    font-size:13px;
    background:var(--surface);
    border:1px solid var(--border);
    padding:18px 20px;
    max-width:480px;
    color:#B9C2E8;
  }
  .term .ln{margin-bottom:5px;}
  .term .ok{color:var(--teal);}
  .term .cur{color:var(--amber);}
  .auth-form-side{display:flex;align-items:center;justify-content:center;padding:40px 24px;}
  .auth-card{width:100%;max-width:400px;}
  .auth-tabs{display:flex;gap:0;margin-bottom:28px;border-bottom:1px solid var(--border);}
  .auth-tab{
    font-family:var(--mono);
    background:none;border:none;color:var(--muted);
    padding:10px 4px;margin-right:24px;font-size:14px;
    border-bottom:2px solid transparent;
  }
  .auth-tab.active{color:var(--text);border-bottom-color:var(--amber);}
  .field{margin-bottom:16px;}
  .err{color:var(--rose);font-size:13px;margin:10px 0 0 0;font-family:var(--mono);}
  .ok-msg{color:var(--teal);font-size:13px;margin:10px 0 0 0;font-family:var(--mono);}
  .info-box{
    max-width:400px;margin:0 auto 18px auto;border:1px solid var(--amber-dim);
    background:rgba(242,184,75,.08);padding:12px 14px;font-family:var(--mono);
    font-size:12px;color:var(--amber);
  }

  /* ---------- APP SHELL ---------- */
  .shell{display:grid;grid-template-columns:300px 1fr;min-height:100vh;}
  @media (max-width:820px){.shell{grid-template-columns:1fr;} .sidebar{display:none;} .sidebar.open{display:block;position:fixed;inset:0;z-index:50;overflow:auto;}}
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:22px 0 40px 0;
    overflow-y:auto;
  }
  .side-head{padding:0 22px 18px 22px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .brand{font-family:var(--mono);font-size:13px;color:var(--amber);}
  .userline{font-size:13px;color:var(--muted);margin-top:6px;}
  .unit-block{margin-bottom:6px;}
  .unit-label{
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    padding:14px 22px 6px 22px;
    letter-spacing:.03em;
  }
  .level-row{
    display:flex;align-items:center;gap:10px;
    padding:9px 22px;
    cursor:pointer;
    border-left:2px solid transparent;
    font-size:13px;
  }
  .level-row:hover{background:var(--surface-2);}
  .level-row.active{background:var(--surface-2);border-left-color:var(--amber);}
  .lvl-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .dot-locked{background:#3a4270;}
  .dot-unlocked{background:var(--amber);}
  .dot-submitted{background:var(--muted);}
  .dot-graded{background:var(--teal);}
  .level-code{font-family:var(--mono);color:var(--muted);font-size:12px;min-width:34px;}
  .main{padding:32px 40px 60px 40px;max-width:900px;}
  @media (max-width:820px){.main{padding:20px;}}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:12px;flex-wrap:wrap;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:12px;
    border:1px solid var(--border);
    padding:5px 10px;color:var(--muted);
  }
  .pill.amber{color:var(--amber);border-color:var(--amber-dim);}
  .pill.teal{color:var(--teal);border-color:#215a54;}

  .exercise-card{
    border:1px solid var(--border);
    background:var(--surface);
    padding:22px 24px;
    margin-bottom:20px;
  }
  .exercise-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .exercise-type{font-family:var(--mono);font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.04em;}
  .grade-badge{font-family:var(--mono);font-size:13px;color:var(--teal);}
  .feedback-box{
    margin-top:12px;padding:12px 14px;
    background:var(--surface-2);
    border-left:2px solid var(--teal);
    font-size:13px;color:#CFEAE6;
  }
  .locked-note{color:var(--muted);font-family:var(--mono);font-size:13px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);}
  th{font-family:var(--mono);color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:var(--surface-2);}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px;}
  .stat-card{border:1px solid var(--border);background:var(--surface);padding:16px 20px;min-width:130px;}
  .stat-num{font-family:var(--mono);font-size:26px;color:var(--amber);}
  .stat-lbl{font-size:12px;color:var(--muted);margin-top:4px;}

  .msg-item{border:1px solid var(--border);background:var(--surface);padding:12px 14px;margin-bottom:10px;font-size:13px;}
  .msg-date{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:4px;}
  .back-link{font-family:var(--mono);font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:18px;display:inline-block;}
  .back-link:hover{color:var(--amber);}
  .grade-row{display:flex;gap:10px;align-items:flex-end;margin-top:14px;flex-wrap:wrap;}
  .grade-row .field{flex:1;min-width:160px;margin-bottom:0;}
  .score-input{width:80px !important;}
  .save-note{font-family:var(--mono);font-size:12px;color:var(--teal);margin-left:10px;}
  .toast{
    position:fixed;bottom:20px;right:20px;
    background:var(--surface-2);border:1px solid var(--teal);
    color:var(--teal);padding:12px 18px;font-family:var(--mono);font-size:13px;
    z-index:200;
  }
  .mobile-topbar{display:none;}
  @media (max-width:820px){
    .mobile-topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface);}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   CONFIGURACIÓN DE SUPABASE — REEMPLAZA ESTOS DOS VALORES
   Los encuentras en tu proyecto: Project Settings → API
   ===================================================================== */
const SUPABASE_URL = "https://fiotnptytwombdknquid.supabase.co";      // <-- REEMPLAZA
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpb3RucHR5dHdvbWJka25xdWlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxODI0MDQsImV4cCI6MjEwNDc1ODQwNH0.pvijQa6s-G4ObqcM-lKKk5MOX7INFanHrnTnNOcFrRI";                 // <-- REEMPLAZA

/* Credenciales con las que se auto-crea la cuenta del administrador
   la primera vez que alguien abre la app sin sesión activa.
   Cámbialas por las que tú quieras usar para entrar como administrador. */
const ADMIN_EMAIL = "admin@labcompiladores.com";              // <-- puedes cambiar
const ADMIN_PASSWORD = "CambiaEstaClave123!";                 // <-- CAMBIA esta clave
const ADMIN_USERNAME = "admin";
const ADMIN_FULLNAME = "Ing. Luis Alberto Garibaldi Leciwr";

const sb = (window.supabase && !SUPABASE_URL.includes("TU-PROYECTO"))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* ============================= APP STATE ============================= */
let LEVELS = [];
let TOTAL_LEVELS = 0;
let TOTAL_EXS = 0;
let EX_META = {}; // exerciseId(db) -> { levelId, position }

let state = {
  screen: "auth",       // auth | student | admin
  authTab: "login",     // login | register
  authError: "",
  authOk: "",
  currentUser: null,    // {id, username, name, role}
  progress: null,       // for student
  messages: [],         // for student
  selectedLevel: 0,
  studentView: "levels", // levels | messages
  // admin
  studentsList: [],     // [{id, username, name}]
  selectedStudent: null,
  selectedStudentProgress: null,
  selectedStudentMessages: [],
  saveNote: "",
  sidebarOpen: false,
};

function normalizeUsername(u){ return (u||"").trim().toLowerCase(); }
function isValidUsername(u){ return /^[a-z0-9_.\-]{3,20}$/.test(u); }

/* ============================= CARGA DE RÚBRICA (BD) ============================= */
async function loadCurriculum(){
  const { data, error } = await sb
    .from('levels')
    .select('*, exercises(*)')
    .order('order_index', { ascending: true })
    .order('position', { foreignTable: 'exercises', ascending: true });
  if(error) throw new Error("No se pudo cargar la rúbrica: " + error.message);
  EX_META = {};
  LEVELS = (data||[]).map(lv=>{
    const exs = (lv.exercises||[]).slice().sort((a,b)=>a.position-b.position).map(e=>{
      EX_META[e.id] = { levelId: lv.id, position: e.position };
      return { exId: e.id, type: e.type, prompt: e.prompt };
    });
    return { id: lv.id, unit: lv.unit, unitTitle: lv.unit_title, code: lv.code, title: lv.title, exs };
  });
  TOTAL_LEVELS = LEVELS.length;
  TOTAL_EXS = LEVELS.reduce((a,l)=>a+l.exs.length,0);
}

/* ============================= ADMIN AUTO-CREACIÓN ============================= */
async function ensureAdmin(){
  if(localStorage.getItem('lab_admin_ensured')) return;
  const { data: sessionData } = await sb.auth.getSession();
  if(sessionData.session){
    // ya hay una sesión activa (de un alumno o admin real) — no la tocamos.
    return;
  }
  try{
    await sb.auth.signUp({
      email: ADMIN_EMAIL,
      password: ADMIN_PASSWORD,
      options: { data: { username: ADMIN_USERNAME, full_name: ADMIN_FULLNAME, role: 'admin' } }
    });
  }catch(e){ /* probablemente ya existe, se ignora */ }
  try{ await sb.auth.signOut(); }catch(e){}
  localStorage.setItem('lab_admin_ensured','1');
}

function levelStatus(progress, levelId){
  return progress.levels[levelId] ? progress.levels[levelId].status : "locked";
}

function computeStudentStats(progress){
  let gradedCount = 0, scoreSum = 0, completedLevels = 0;
  LEVELS.forEach(lv=>{
    const L = progress.levels[lv.id];
    if(!L) return;
    if(L.status === "submitted" || L.status === "graded") completedLevels++;
    lv.exs.forEach((ex,i)=>{
      const sc = L.scores[i];
      if(sc && typeof sc.score === "number"){
        gradedCount++; scoreSum += sc.score;
      }
    });
  });
  const avg = gradedCount>0 ? (scoreSum/gradedCount) : null;
  return { completedLevels, gradedCount, totalExs: TOTAL_EXS, avg };
}

/* ============================= RENDER ROOT ============================= */
async function render(){
  const app = document.getElementById("app");
  if(state.screen === "auth"){
    app.innerHTML = renderAuth();
    attachAuthHandlers();
    return;
  }
  if(state.screen === "student"){
    app.innerHTML = renderStudentShell();
    attachStudentHandlers();
    return;
  }
  if(state.screen === "admin"){
    app.innerHTML = renderAdminShell();
    attachAdminHandlers();
    return;
  }
}

/* ============================= AUTH SCREEN ============================= */
function renderAuth(){
  const isLogin = state.authTab === "login";
  return `
  <div class="auth-wrap">
    <div class="auth-hero">
      <div>
        <div class="hero-tag">// lenguajes y autómatas · plataforma de práctica</div>
        <h1 class="hero-title">Laboratorio de Compiladores</h1>
        <p class="hero-sub">Practica análisis semántico, generación de código intermedio, optimización y generación de código objeto — un tema a la vez, en orden, hasta dominar el curso.</p>
      </div>
      <div class="term">
        <div class="ln">$ etapa <span class="ok">análisis_semántico</span> ..... completa</div>
        <div class="ln">$ etapa <span class="cur">código_intermedio</span> ..... en progreso</div>
        <div class="ln">$ etapa optimización ..... bloqueada</div>
        <div class="ln">$ etapa código_objeto ..... bloqueada</div>
      </div>
    </div>
    <div class="auth-form-side">
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab ${isLogin?'active':''}" data-tab="login">Iniciar sesión</button>
          <button class="auth-tab ${!isLogin?'active':''}" data-tab="register">Registrarse</button>
        </div>
        ${isLogin ? `
          <form id="loginForm">
            <div class="field"><label>Correo electrónico</label><input type="email" id="loginEmail" autocomplete="username" required></div>
            <div class="field"><label>Contraseña</label><input type="password" id="loginPass" autocomplete="current-password" required></div>
            <button type="submit" class="primary" style="width:100%">Entrar</button>
            ${state.authError ? `<p class="err">${state.authError}</p>` : ""}
          </form>
        ` : `
          <form id="registerForm">
            <div class="field"><label>Nombre completo</label><input type="text" id="regName" required></div>
            <div class="field"><label>Correo electrónico</label><input type="email" id="regEmail" required></div>
            <div class="field"><label>Usuario (sin espacios, ej: jperez)</label><input type="text" id="regUser" required pattern="[a-zA-Z0-9_.\\-]{3,20}" title="3-20 caracteres: letras, números, punto, guion o guion bajo"></div>
            <div class="field"><label>Contraseña (mínimo 6 caracteres)</label><input type="password" id="regPass" required minlength="6"></div>
            <button type="submit" class="primary" style="width:100%">Crear cuenta</button>
            ${state.authError ? `<p class="err">${state.authError}</p>` : ""}
            ${state.authOk ? `<p class="ok-msg">${state.authOk}</p>` : ""}
          </form>
        `}
      </div>
    </div>
  </div>`;
}

function attachAuthHandlers(){
  document.querySelectorAll(".auth-tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.authTab = btn.dataset.tab;
      state.authError=""; state.authOk="";
      render();
    });
  });

  const loginForm = document.getElementById("loginForm");
  if(loginForm){
    loginForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const submitBtn = loginForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      const email = document.getElementById("loginEmail").value.trim();
      const pass = document.getElementById("loginPass").value;
      state.authError = "";
      try{
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
        if(error){
          state.authError = /confirm/i.test(error.message)
            ? "Debes confirmar tu correo antes de iniciar sesión (revisa tu bandeja de entrada)."
            : "Correo o contraseña incorrectos.";
          render();
          return;
        }
        const { data: profile, error: profErr } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
        if(profErr || !profile){
          state.authError = "No se encontró tu perfil. Contacta al administrador.";
          render();
          return;
        }
        state.currentUser = { id: profile.id, username: profile.username, name: profile.full_name, role: profile.role };
        if(profile.role === "admin"){
          await loadAdminData();
          state.screen = "admin";
        } else {
          await loadStudentData();
          state.screen = "student";
        }
        render();
      }catch(err){
        state.authError = "Error al iniciar sesión: " + (err.message||err);
        render();
      }
    });
  }

  const regForm = document.getElementById("registerForm");
  if(regForm){
    regForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      state.authOk = ""; state.authError = "";
      const submitBtn = regForm.querySelector('button[type="submit"]');
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const uRaw = document.getElementById("regUser").value;
      const p = document.getElementById("regPass").value;
      const u = normalizeUsername(uRaw);
      if(!name || !email || !uRaw || !p){ state.authError="Completa todos los campos."; render(); return; }
      if(!isValidUsername(u)){
        state.authError = "El usuario debe tener 3-20 caracteres: solo letras, números, punto, guion o guion bajo (sin espacios ni acentos).";
        render();
        return;
      }
      if(u === ADMIN_USERNAME){ state.authError="Ese usuario no está disponible."; render(); return; }
      submitBtn.disabled = true;
      try{
        const { data, error } = await sb.auth.signUp({
          email, password: p,
          options: { data: { username: u, full_name: name, role: 'student' } }
        });
        if(error){
          state.authError = /registered/i.test(error.message)
            ? "Ese correo ya está registrado."
            : "No se pudo crear la cuenta (verifica que el usuario y correo no estén ya en uso).";
          render();
          return;
        }
        if(data.session){
          // confirmación de correo desactivada en el proyecto: ya quedó logeado
          const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
          if(profile){
            state.currentUser = { id: profile.id, username: profile.username, name: profile.full_name, role: profile.role };
            await loadStudentData();
            state.screen = "student";
            render();
            return;
          }
        }
        state.authOk = "Cuenta creada. Revisa tu correo para confirmar la cuenta y después inicia sesión.";
        state.authTab = "login";
        render();
      }catch(err){
        state.authError = "No se pudo crear la cuenta: " + (err.message||err);
        render();
      }
    });
  }
}

/* ============================= STUDENT ============================= */
async function loadStudentData(){
  const uid = state.currentUser.id;
  const [{data:lp, error:e1}, {data:subs, error:e2}, {data:msgs, error:e3}] = await Promise.all([
    sb.from('level_progress').select('*').eq('student_id', uid),
    sb.from('submissions').select('*').eq('student_id', uid),
    sb.from('messages').select('*').eq('student_id', uid).order('created_at', {ascending:true})
  ]);
  if(e1||e2||e3) throw new Error("No se pudo cargar tu progreso.");

  const progress = { levels:{} };
  LEVELS.forEach(lv=>{
    const row = (lp||[]).find(r=>r.level_id===lv.id);
    progress.levels[lv.id] = { status: row ? row.status : (lv.id===0?'unlocked':'locked'), answers:{}, scores:{}, subIds:{} };
  });
  (subs||[]).forEach(s=>{
    const meta = EX_META[s.exercise_id];
    if(!meta) return;
    const L = progress.levels[meta.levelId];
    L.subIds[meta.position] = s.id;
    if(s.answer) L.answers[meta.position] = s.answer;
    if(s.score !== null && s.score !== undefined){
      L.scores[meta.position] = { score: Number(s.score), feedback: s.feedback };
    }
  });

  state.progress = progress;
  state.messages = (msgs||[]).map(m=>({ text: m.body, date: new Date(m.created_at).toLocaleString('es-MX') }));
  state.selectedLevel = 0;
  state.studentView = "levels";
}

function renderStudentShell(){
  const prog = state.progress;
  const stats = computeStudentStats(prog);
  const unreadCount = state.messages.length;

  let sidebarHtml = `<div class="side-head">
      <div class="brand">// lab de compiladores</div>
      <div class="userline">${escapeHtml(state.currentUser.name)}</div>
    </div>`;
  const units = [...new Set(LEVELS.map(l=>l.unit))];
  units.forEach(unit=>{
    const first = LEVELS.find(l=>l.unit===unit);
    sidebarHtml += `<div class="unit-block"><div class="unit-label">${unit} — ${first.unitTitle}</div>`;
    LEVELS.filter(lv=>lv.unit===unit).forEach(lv=>{
      const st = levelStatus(prog, lv.id);
      const dotClass = st==="locked" ? "dot-locked" : st==="unlocked" ? "dot-unlocked" : st==="submitted" ? "dot-submitted" : "dot-graded";
      const active = (state.studentView==="levels" && state.selectedLevel===LEVELS.findIndex(x=>x.id===lv.id)) ? "active" : "";
      sidebarHtml += `<div class="level-row ${active}" data-level="${LEVELS.findIndex(x=>x.id===lv.id)}">
        <span class="lvl-dot ${dotClass}"></span>
        <span class="level-code">${lv.code}</span>
        <span>${escapeHtml(lv.title)}</span>
      </div>`;
    });
    sidebarHtml += `</div>`;
  });
  sidebarHtml += `<div class="level-row ${state.studentView==='messages'?'active':''}" id="msgNav" style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px;">
      <span class="lvl-dot" style="background:var(--amber);"></span>
      <span>Mensajes${unreadCount?` (${unreadCount})`:''}</span>
    </div>
    <div class="level-row" id="logoutBtnSide"><span class="lvl-dot" style="background:var(--rose);"></span><span>Cerrar sesión</span></div>`;

  let mainHtml = "";
  if(state.studentView === "messages"){
    mainHtml = renderStudentMessages();
  } else {
    mainHtml = renderStudentLevel(prog, stats);
  }

  return `
  <div class="mobile-topbar">
    <button class="ghost" id="hamburger">☰ temas</button>
    <span class="mono muted">${escapeHtml(state.currentUser.name)}</span>
  </div>
  <div class="shell">
    <div class="sidebar ${state.sidebarOpen?'open':''}" id="sidebar">${sidebarHtml}</div>
    <div class="main">${mainHtml}</div>
  </div>`;
}

function renderStudentLevel(prog, stats){
  const lv = LEVELS[state.selectedLevel];
  const st = levelStatus(prog, lv.id);
  const L = prog.levels[lv.id];

  let exsHtml = "";
  if(st === "locked"){
    exsHtml = `<p class="locked-note">🔒 Este tema se desbloquea al completar el anterior.</p>`;
  } else {
    lv.exs.forEach((ex,i)=>{
      const savedAnswer = (L.answers[i] || "");
      const sc = L.scores[i];
      const readOnly = (st === "submitted" || st === "graded");
      exsHtml += `
      <div class="exercise-card">
        <div class="exercise-head">
          <span class="exercise-type">${ex.type}</span>
          ${sc && typeof sc.score==="number" ? `<span class="grade-badge">Calificación: ${sc.score}/10</span>` : ""}
        </div>
        <p>${escapeHtml(ex.prompt)}</p>
        <textarea data-exidx="${i}" ${readOnly?'readonly':''} placeholder="Escribe tu respuesta o desarrollo aquí...">${escapeHtml(savedAnswer)}</textarea>
        ${sc && sc.feedback ? `<div class="feedback-box"><strong>Retroalimentación del profesor:</strong><br>${escapeHtml(sc.feedback)}</div>` : ""}
      </div>`;
    });
  }

  let actionHtml = "";
  if(st === "unlocked"){
    actionHtml = `<button class="primary" id="submitLevelBtn">Entregar tema ${lv.code}</button>`;
  } else if(st === "submitted"){
    actionHtml = `<span class="pill">Entregado — esperando calificación</span>`;
  } else if(st === "graded"){
    actionHtml = `<span class="pill teal">Calificado</span>`;
  }

  return `
    <div class="topbar">
      <div>
        <h2>${lv.code} · ${escapeHtml(lv.title)}</h2>
        <span class="muted mono" style="font-size:12px;">${lv.unit} — ${lv.unitTitle}</span>
      </div>
      <div class="pill amber">Nivel ${state.selectedLevel+1} / ${TOTAL_LEVELS}</div>
    </div>
    <div class="stat-row">
      <div class="stat-card"><div class="stat-num">${stats.completedLevels}/${TOTAL_LEVELS}</div><div class="stat-lbl">Temas entregados</div></div>
      <div class="stat-card"><div class="stat-num">${stats.avg!==null? stats.avg.toFixed(1) : "—"}</div><div class="stat-lbl">Promedio actual</div></div>
      <div class="stat-card"><div class="stat-num">${stats.gradedCount}/${stats.totalExs}</div><div class="stat-lbl">Ejercicios calificados</div></div>
    </div>
    ${exsHtml}
    <div style="margin-top:20px;">${actionHtml}</div>
  `;
}

function renderStudentMessages(){
  let list = "";
  if(state.messages.length === 0){
    list = `<p class="muted">Aún no tienes mensajes del profesor.</p>`;
  } else {
    [...state.messages].reverse().forEach(m=>{
      list += `<div class="msg-item"><div class="msg-date">${escapeHtml(m.date)}</div>${escapeHtml(m.text)}</div>`;
    });
  }
  return `<h2>Mensajes del profesor</h2>${list}`;
}

function attachStudentHandlers(){
  const hamburger = document.getElementById("hamburger");
  if(hamburger) hamburger.addEventListener("click", ()=>{ state.sidebarOpen = !state.sidebarOpen; render(); });

  document.querySelectorAll(".level-row[data-level]").forEach(row=>{
    row.addEventListener("click", ()=>{
      state.selectedLevel = parseInt(row.dataset.level,10);
      state.studentView = "levels";
      state.sidebarOpen = false;
      render();
    });
  });
  const msgNav = document.getElementById("msgNav");
  if(msgNav) msgNav.addEventListener("click", ()=>{ state.studentView="messages"; state.sidebarOpen=false; render(); });

  const logoutSide = document.getElementById("logoutBtnSide");
  if(logoutSide) logoutSide.addEventListener("click", doLogout);

  const submitBtn = document.getElementById("submitLevelBtn");
  if(submitBtn){
    submitBtn.addEventListener("click", async ()=>{
      const lv = LEVELS[state.selectedLevel];
      const textareas = document.querySelectorAll("textarea[data-exidx]");
      const answers = {};
      let allFilled = true;
      textareas.forEach(ta=>{
        const idx = parseInt(ta.dataset.exidx,10);
        const val = ta.value.trim();
        if(!val) allFilled = false;
        answers[idx] = val;
      });
      if(!allFilled){
        alert("Responde ambos ejercicios antes de entregar el tema.");
        return;
      }
      submitBtn.disabled = true;
      try{
        const uid = state.currentUser.id;
        for(let i=0;i<lv.exs.length;i++){
          const ex = lv.exs[i];
          const existingId = state.progress.levels[lv.id].subIds[i];
          if(existingId){
            const { error } = await sb.from('submissions')
              .update({ answer: answers[i], submitted_at: new Date().toISOString() })
              .eq('id', existingId);
            if(error) throw error;
          } else {
            const { error } = await sb.from('submissions')
              .insert({ student_id: uid, exercise_id: ex.exId, answer: answers[i], submitted_at: new Date().toISOString() });
            if(error) throw error;
          }
        }
        const { error: upErr } = await sb.from('level_progress')
          .update({ status:'submitted', submitted_at: new Date().toISOString() })
          .eq('student_id', uid).eq('level_id', lv.id);
        if(upErr) throw upErr;

        const nextLevel = LEVELS[state.selectedLevel+1];
        if(nextLevel && state.progress.levels[nextLevel.id].status === 'locked'){
          await sb.from('level_progress')
            .update({ status:'unlocked', unlocked_at: new Date().toISOString() })
            .eq('student_id', uid).eq('level_id', nextLevel.id);
        }
        await loadStudentData();
        render();
      }catch(err){
        alert("Ocurrió un error al entregar el tema: " + (err.message||err));
        submitBtn.disabled = false;
      }
    });
  }
}

async function doLogout(){
  try{ await sb.auth.signOut(); }catch(e){}
  state.currentUser = null;
  state.progress = null;
  state.messages = [];
  state.selectedLevel = 0;
  state.studentsList = [];
  state.selectedStudent = null;
  state.selectedStudentProgress = null;
  state.screen = "auth";
  state.authTab = "login";
  state.authError = ""; state.authOk="";
  render();
}

/* ============================= ADMIN ============================= */
async function loadAdminData(){
  const { data, error } = await sb.from('profiles').select('id, username, full_name').eq('role','student').order('full_name');
  if(error) throw new Error("No se pudo cargar la lista de alumnos: " + error.message);
  state.studentsList = (data||[]).map(s=>({ id:s.id, username:s.username, name:s.full_name }));
  state.selectedStudent = null;
  state.selectedStudentProgress = null;
}

function renderAdminShell(){
  let mainHtml = "";
  if(!state.selectedStudent){
    mainHtml = renderAdminOverview();
  } else {
    mainHtml = renderAdminStudentDetail();
  }
  return `
  <div class="mobile-topbar">
    <span class="mono muted">Panel administrador</span>
    <button class="ghost" id="logoutBtnTop">Salir</button>
  </div>
  <div class="shell" style="grid-template-columns:1fr;">
    <div class="main" style="max-width:1100px;">
      <div class="topbar">
        <div>
          <h2>Panel del administrador</h2>
          <span class="muted mono" style="font-size:12px;">${escapeHtml(state.currentUser.name)}</span>
        </div>
        <button class="ghost" id="logoutBtnAdmin">Cerrar sesión</button>
      </div>
      ${mainHtml}
    </div>
  </div>`;
}

function renderAdminOverview(){
  if(state.studentsList.length === 0){
    return `<p class="muted">Todavía no hay alumnos registrados.</p>`;
  }
  return `<div id="adminTableWrap"><p class="muted">Cargando estadísticas de alumnos…</p></div>`;
}

async function renderAdminOverviewAsync(){
  const wrap = document.getElementById("adminTableWrap");
  if(!wrap) return;
  const { data, error } = await sb.from('student_stats').select('*');
  if(error){
    wrap.innerHTML = `<p class="err">No se pudieron cargar las estadísticas: ${escapeHtml(error.message)}</p>`;
    return;
  }
  const byId = {};
  (data||[]).forEach(r=>{ byId[r.student_id] = r; });

  let rows = "";
  state.studentsList.forEach(s=>{
    const st = byId[s.id] || {};
    const avg = (st.average_score !== undefined && st.average_score !== null) ? Number(st.average_score).toFixed(1) : "—";
    rows += `<tr class="clickable" data-studentid="${s.id}">
      <td>${escapeHtml(s.name)}</td>
      <td class="mono muted">${escapeHtml(s.username)}</td>
      <td>${st.levels_completed||0}/${TOTAL_LEVELS}</td>
      <td>${st.graded_exercises||0}/${TOTAL_EXS}</td>
      <td>${avg}</td>
    </tr>`;
  });
  wrap.innerHTML = `<table>
    <thead><tr><th>Alumno</th><th>Usuario</th><th>Temas entregados</th><th>Ejercicios calificados</th><th>Promedio</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
  wrap.querySelectorAll("tr[data-studentid]").forEach(tr=>{
    tr.addEventListener("click", async ()=>{
      state.selectedStudent = tr.dataset.studentid;
      await openStudentDetail();
      render();
    });
  });
}

async function openStudentDetail(){
  const uid = state.selectedStudent;
  const [{data:lp}, {data:subs}, {data:msgs}] = await Promise.all([
    sb.from('level_progress').select('*').eq('student_id', uid),
    sb.from('submissions').select('*').eq('student_id', uid),
    sb.from('messages').select('*').eq('student_id', uid).order('created_at', {ascending:true})
  ]);
  const progress = { levels:{} };
  LEVELS.forEach(lv=>{
    const row = (lp||[]).find(r=>r.level_id===lv.id);
    progress.levels[lv.id] = { status: row ? row.status : 'locked', answers:{}, scores:{}, subIds:{} };
  });
  (subs||[]).forEach(s=>{
    const meta = EX_META[s.exercise_id];
    if(!meta) return;
    const L = progress.levels[meta.levelId];
    L.subIds[meta.position] = s.id;
    if(s.answer) L.answers[meta.position] = s.answer;
    if(s.score !== null && s.score !== undefined){
      L.scores[meta.position] = { score: Number(s.score), feedback: s.feedback };
    }
  });
  state.selectedStudentProgress = progress;
  state.selectedStudentMessages = (msgs||[]).map(m=>({ text: m.body, date: new Date(m.created_at).toLocaleString('es-MX') }));
}

function renderAdminStudentDetail(){
  const info = state.studentsList.find(s=>s.id===state.selectedStudent);
  const prog = state.selectedStudentProgress;
  const stats = computeStudentStats(prog);

  let levelsHtml = "";
  LEVELS.forEach(lv=>{
    const L = prog.levels[lv.id];
    const st = L.status;
    if(st === "locked") return;
    let exsHtml = "";
    lv.exs.forEach((ex,i)=>{
      const answer = L.answers[i] || "";
      const sc = L.scores[i] || {};
      exsHtml += `
      <div class="exercise-card">
        <div class="exercise-head">
          <span class="exercise-type">${ex.type}</span>
        </div>
        <p class="muted" style="font-size:13px;">${escapeHtml(ex.prompt)}</p>
        <div style="background:var(--surface-2);border:1px solid var(--border);padding:10px 12px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;margin-bottom:12px;">${answer? escapeHtml(answer) : '<span class="muted">(sin respuesta)</span>'}</div>
        <div class="grade-row">
          <div class="field score-field">
            <label>Calificación (0-10)</label>
            <input type="number" min="0" max="10" step="0.1" class="score-input" data-level="${lv.id}" data-exidx="${i}" value="${typeof sc.score==='number'?sc.score:''}">
          </div>
          <div class="field" style="flex:2;">
            <label>Retroalimentación</label>
            <input type="text" data-level="${lv.id}" data-exidx="${i}" class="fb-input" value="${sc.feedback?escapeHtml(sc.feedback):''}" placeholder="Comentario para el alumno...">
          </div>
          <button class="primary saveGradeBtn" data-level="${lv.id}" data-exidx="${i}">Guardar</button>
        </div>
      </div>`;
    });
    levelsHtml += `<h3 style="margin-top:26px;">${lv.code} · ${escapeHtml(lv.title)} <span class="mono muted" style="font-size:12px;">(${st==='graded'?'calificado':'entregado'})</span></h3>${exsHtml}`;
  });

  if(!levelsHtml){
    levelsHtml = `<p class="muted">Este alumno aún no ha entregado ningún tema.</p>`;
  }

  let msgsHtml = "";
  (state.selectedStudentMessages||[]).slice().reverse().forEach(m=>{
    msgsHtml += `<div class="msg-item"><div class="msg-date">${escapeHtml(m.date)}</div>${escapeHtml(m.text)}</div>`;
  });

  return `
    <span class="back-link" id="backToOverview">← volver al listado</span>
    <h2 style="margin-bottom:2px;">${escapeHtml(info.name)}</h2>
    <span class="muted mono" style="font-size:12px;">@${escapeHtml(info.username)}</span>
    <div class="stat-row" style="margin-top:18px;">
      <div class="stat-card"><div class="stat-num">${stats.completedLevels}/${TOTAL_LEVELS}</div><div class="stat-lbl">Temas entregados</div></div>
      <div class="stat-card"><div class="stat-num">${stats.avg!==null?stats.avg.toFixed(1):"—"}</div><div class="stat-lbl">Promedio final</div></div>
      <div class="stat-card"><div class="stat-num">${stats.gradedCount}/${stats.totalExs}</div><div class="stat-lbl">Calificados</div></div>
    </div>

    <div class="exercise-card">
      <label>Enviar mensaje de retroalimentación general</label>
      <textarea id="adminMsgBox" placeholder="Escribe un mensaje para este alumno..."></textarea>
      <button class="primary" id="sendMsgBtn" style="margin-top:10px;">Enviar mensaje</button>
      ${state.saveNote ? `<span class="save-note">${state.saveNote}</span>` : ""}
    </div>
    ${msgsHtml ? `<h3>Historial de mensajes</h3>${msgsHtml}` : ""}

    <h3 style="margin-top:30px;">Temas entregados</h3>
    ${levelsHtml}
  `;
}

function attachAdminHandlers(){
  const logoutTop = document.getElementById("logoutBtnTop");
  if(logoutTop) logoutTop.addEventListener("click", doLogout);
  const logoutAdmin = document.getElementById("logoutBtnAdmin");
  if(logoutAdmin) logoutAdmin.addEventListener("click", doLogout);

  if(!state.selectedStudent){
    renderAdminOverviewAsync();
    return;
  }

  const back = document.getElementById("backToOverview");
  if(back) back.addEventListener("click", async ()=>{
    state.selectedStudent = null;
    state.selectedStudentProgress = null;
    state.saveNote = "";
    await loadAdminData();
    render();
  });

  document.querySelectorAll(".saveGradeBtn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const levelId = parseInt(btn.dataset.level,10);
      const exIdx = parseInt(btn.dataset.exidx,10);
      const container = btn.closest(".grade-row");
      const scoreInput = container.querySelector(".score-input");
      const fbInput = container.querySelector(".fb-input");
      const scoreVal = scoreInput.value === "" ? null : parseFloat(scoreInput.value);
      const prog = state.selectedStudentProgress;
      const subId = prog.levels[levelId].subIds[exIdx];
      if(!subId){ alert("No se encontró la entrega de este ejercicio."); return; }
      btn.disabled = true;
      const feedbackVal = fbInput.value.trim();
      const { error } = await sb.from('submissions').update({
        score: scoreVal, feedback: feedbackVal,
        graded_at: new Date().toISOString(), graded_by: state.currentUser.id
      }).eq('id', subId);
      if(error){
        alert("Error al guardar la calificación: " + error.message);
        btn.disabled = false;
        return;
      }
      prog.levels[levelId].scores[exIdx] = { score: scoreVal, feedback: feedbackVal };
      const lv = LEVELS.find(l=>l.id===levelId);
      const allGraded = lv.exs.every((_,i)=> prog.levels[levelId].scores[i] && typeof prog.levels[levelId].scores[i].score === "number");
      if(allGraded){
        await sb.from('level_progress').update({ status:'graded' }).eq('student_id', state.selectedStudent).eq('level_id', levelId);
        prog.levels[levelId].status = 'graded';
      }
      state.saveNote = "Calificación guardada.";
      render();
    });
  });

  const sendBtn = document.getElementById("sendMsgBtn");
  if(sendBtn){
    sendBtn.addEventListener("click", async ()=>{
      const box = document.getElementById("adminMsgBox");
      const text = box.value.trim();
      if(!text) return;
      sendBtn.disabled = true;
      const { data, error } = await sb.from('messages').insert({
        student_id: state.selectedStudent, sender_id: state.currentUser.id, body: text
      }).select().single();
      if(error){
        alert("Error al enviar el mensaje: " + error.message);
        sendBtn.disabled = false;
        return;
      }
      state.selectedStudentMessages = state.selectedStudentMessages || [];
      state.selectedStudentMessages.push({ text: data.body, date: new Date(data.created_at).toLocaleString('es-MX') });
      state.saveNote = "Mensaje enviado.";
      render();
    });
  }
}

/* ============================= UTIL ============================= */
function escapeHtml(str){
  if(str===null || str===undefined) return "";
  return String(str)
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

/* ============================= INIT ============================= */
(async function init(){
  const app = document.getElementById("app");
  if(!sb){
    app.innerHTML = `<div style="max-width:620px;margin:80px auto;font-family:'IBM Plex Mono',monospace;padding:24px;border:1px solid #F2B84B;color:#EDEFF7;">
      <h2 style="color:#F2B84B;margin-top:0;">Configura Supabase</h2>
      <p>Antes de usar la app, abre este archivo y reemplaza <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code> al inicio del &lt;script&gt; con los valores de tu proyecto (Project Settings → API en tu panel de Supabase).</p>
    </div>`;
    return;
  }
  try{
    await loadCurriculum();
    await ensureAdmin();
    const { data: sessionData } = await sb.auth.getSession();
    if(sessionData.session){
      const uid = sessionData.session.user.id;
      const { data: profile } = await sb.from('profiles').select('*').eq('id', uid).single();
      if(profile){
        state.currentUser = { id: profile.id, username: profile.username, name: profile.full_name, role: profile.role };
        if(profile.role === 'admin'){
          await loadAdminData();
          state.screen = 'admin';
        } else {
          await loadStudentData();
          state.screen = 'student';
        }
      }
    }
    await render();
  }catch(err){
    app.innerHTML =
      '<div style="max-width:520px;margin:60px auto;font-family:IBM Plex Mono,monospace;color:#E5646E;padding:20px;border:1px solid #E5646E;">'+
      '<h2 style="margin-top:0;">Error al iniciar la app</h2>'+
      '<p style="color:#EDEFF7;">'+escapeHtml(err && err.message ? err.message : String(err))+'</p>'+
      '<p style="color:#98A2C7;">Recarga la página. Si el problema sigue, verifica que el script SQL se haya ejecutado correctamente y que las credenciales de Supabase sean correctas.</p>'+
      '</div>';
  }
})();
window.addEventListener("error", function(e){
  console.error("Error no capturado:", e.error || e.message);
});
</script>
